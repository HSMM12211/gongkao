[package]
name = "gongkao-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"
cpal = "0.17"
whisper-rs = "0.16"
rubato = "0.16"
character_converter = "2.1.5"
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
url = "2.5.8"
uuid = { version = "1.23.1", features = ["v4"] }
flate2 = "1.1.9"
transcribe-rs = { version = "0.3.8", features = ["whisper-cpp", "onnx"] }
reqwest = { version = "0.13.3", features = ["blocking", "json", "stream"] }
tar = "0.4.46"
futures-util = "0.3"
